# Foreman as a GitHub Action: the same deterministic detector the plugin runs, as a check on a pull request.
#
#   - uses: actions/checkout@<sha>
#     with:
#       fetch-depth: 0            # the detector reads the whole range, history included
#   - uses: PedValme/foreman@<the full 40-character SHA of the Foreman commit you reviewed>
#
# It is a lock only where the agent cannot move it. Four things, each explained in README.md ("In CI, for any
# agent"): the job is a required status check (with no `if:` on it); .github/workflows/ is protected (a pull
# request runs its own copy of a workflow); the rules bind the agent's own account; and Foreman runs in a job of
# its own, right after the checkout, because a step that installs or runs the pull request's code can change the
# Python, the shell or this action's own files before Foreman runs.
#
# Exit codes: 0 clean, 1 at least one blocker, 2 the run could not be done (no base, not a repository, git failed, a
# SARIF report that cannot be read): a check that could not run must not pass.
name: Foreman check
description: >-
  A green check the agent did not rig: fails a pull request that skips, deletes or moves tests, changes what the
  check runs, or carries a secret. No model, no network, Python's standard library and git.
author: PedValme
branding:
  icon: shield
  color: gray-dark

inputs:
  base:
    description: >-
      The revision the pull request is compared with. Default: origin/<the pull request's base branch>.
    required: false
    default: ""
  head:
    description: The revision to check.
    required: false
    default: HEAD
  strict:
    description: >-
      "true" (default): a finding the author marked `foreman:allow` fails the check, because in CI nobody can be
      asked. "false": marked findings are listed as warnings on the pull request and do not fail it; use it only
      where a person reviews every pull request before it merges.
    required: false
    default: "true"
  check:
    description: >-
      The command that runs your tests, so a change to it or to what it runs is a finding. Default: `check` in the
      base's .foreman.json.
    required: false
    default: ""
  sarif:
    description: SARIF 2.1.0 reports to read as a source of findings, one path per line. Foreman runs no scanner.
    required: false
    default: ""
  sarif-threshold:
    description: error (default), warning, or a number from 0 to 10; results at or above it block.
    required: false
    default: ""
  sarif-scope:
    description: changed (default) only results in files the pull request touches block; all lets every result block.
    required: false
    default: ""
  repo:
    description: A path inside the repository to check. Default, the workspace.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Foreman
      shell: bash
      # Every input reaches the script through the environment, never pasted into it: a branch name or a path
      # cannot become shell.
      env:
        FOREMAN_HOME: ${{ github.action_path }}
        FOREMAN_BASE: ${{ inputs.base }}
        FOREMAN_BASE_REF: ${{ github.base_ref }}
        FOREMAN_HEAD: ${{ inputs.head }}
        FOREMAN_STRICT: ${{ inputs.strict }}
        FOREMAN_CHECK: ${{ inputs.check }}
        FOREMAN_SARIF: ${{ inputs.sarif }}
        FOREMAN_SARIF_THRESHOLD: ${{ inputs.sarif-threshold }}
        FOREMAN_SARIF_SCOPE: ${{ inputs.sarif-scope }}
        FOREMAN_REPO: ${{ inputs.repo }}
      run: |
        set -u
        base="$FOREMAN_BASE"
        if [ -z "$base" ]; then
          if [ -z "$FOREMAN_BASE_REF" ]; then
            echo "::error::Foreman has nothing to compare with: run it on pull_request events, or give it a base."
            exit 2
          fi
          base="origin/$FOREMAN_BASE_REF"
        fi
        python=""
        for candidate in python3 python; do
          if "$candidate" -I -c "import sys; sys.exit(0 if sys.version_info >= (3, 9) else 1)" >/dev/null 2>&1; then
            python="$candidate"
            break
          fi
        done
        if [ -z "$python" ]; then
          echo "::error::Foreman needs Python 3.9 or newer on the runner (add actions/setup-python before it)."
          exit 2
        fi
        case "$FOREMAN_STRICT" in
          true|false) ;;
          *) echo "::error::Foreman: strict is \"true\" or \"false\"."; exit 2 ;;
        esac
        args=("$base" "$FOREMAN_HEAD" --repo "$FOREMAN_REPO")
        if [ "$FOREMAN_STRICT" = "true" ]; then args+=(--strict); fi
        if [ -n "$FOREMAN_CHECK" ]; then args+=(--check "$FOREMAN_CHECK"); fi
        if [ -n "$FOREMAN_SARIF_THRESHOLD" ]; then args+=(--sarif-threshold "$FOREMAN_SARIF_THRESHOLD"); fi
        if [ -n "$FOREMAN_SARIF_SCOPE" ]; then args+=(--sarif-scope "$FOREMAN_SARIF_SCOPE"); fi
        while IFS= read -r report; do
          report="${report%$'\r'}"
          if [ -n "$report" ]; then args+=(--sarif "$report"); fi
        done <<< "$FOREMAN_SARIF"
        # Isolated (-I): Python then puts neither the current directory nor anything from the environment on its
        # import path, so a pull request that adds a folder named `foreman` cannot take the detector's place. The
        # only place Foreman is loaded from is this action's own checkout.
        "$python" -I -c 'import sys; sys.path.insert(0, sys.argv[1]); from foreman import detector; raise SystemExit(detector.main(sys.argv[2:]))' "$FOREMAN_HOME/plugin" "${args[@]}"
