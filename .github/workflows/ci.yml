name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.9 is the oldest `python3` the adapters accept (macOS ships it); Hermes itself needs 3.11.
        python: ["3.9", "3.11", "3.13"]
        exclude:
          - os: ubuntu-latest   # setup-python has no 3.9 for the current Ubuntu image
            python: "3.9"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Git identity for the tests
        run: |
          git config --global user.name "Foreman CI"
          git config --global user.email "ci@example.invalid"
      - name: Unit tests
        run: python -m unittest discover -s tests -q

  action:
    # action.yml, run for real (`uses: ./`) on a repository made here: a clean change passes and a change that
    # switches a test off fails, with a folder named `foreman` planted where the action runs, which a detector run
    # as `python -m` from there would load in the real one's place. On Windows too: the action's script is bash,
    # and there it is Git's.
    name: action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: This pull request itself, as a user's workflow would run it (no inputs, the default base)
        if: github.event_name == 'pull_request'
        uses: ./
        with:
          strict: "false"   # this repository's own check is the job `foreman` below; here the action is what is tried
      - name: A repository with a clean branch and a rigged one, and a planted detector
        shell: bash
        run: |
          set -eu
          git init -q -b main fixture && cd fixture
          git config user.name "Foreman CI" && git config user.email "ci@example.invalid"
          mkdir tests && printf 'def test_x():\n    assert True\n' > tests/test_app.py && printf 'x = 1\n' > app.py
          git add -A && git commit -q -m base
          git checkout -q -b clean && printf 'x = 2\n' > app.py && git commit -q -am "a change"
          git checkout -q -b rigged main
          printf '%s\ndef test_x():\n    assert True\n' "@pytest.mark.""skip" > tests/test_app.py
          git commit -q -am "switch a test off"
          # Where the action's script runs (the workspace): a `foreman` that answers CLEAN to everything.
          cd "$GITHUB_WORKSPACE" && mkdir foreman && : > foreman/__init__.py
          printf 'import sys\nprint("foreman: CLEAN, says the planted one")\nsys.exit(0)\n' > foreman/detector.py
      - name: The clean branch passes
        uses: ./
        with:
          repo: fixture
          base: main
          head: clean
      - name: The rigged branch
        id: rigged
        continue-on-error: true
        uses: ./
        with:
          repo: fixture
          base: main
          head: rigged
      - name: The rigged branch was refused
        shell: bash
        env:
          RIGGED: ${{ steps.rigged.outcome }}
        run: |
          echo "the rigged branch: $RIGGED"
          [ "$RIGGED" = "failure" ]

  foreman:
    # Foreman on its own pull requests: skipped or deleted tests, a changed check, secrets. It runs the BASE branch's
    # detector (a second worktree), so a pull request that weakens the detector cannot approve itself.
    name: foreman (pull requests)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Run the base's detector against the pull request
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git worktree add ../base "origin/$BASE"
          # The plugin lives in plugin/; a base from before that move has the foreman package at its root.
          if [ -d ../base/plugin/foreman ]; then cd ../base/plugin; else cd ../base; fi
          python -m foreman.detector "origin/$BASE" HEAD --repo "$GITHUB_WORKSPACE"
