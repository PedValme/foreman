name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Git identity for the tests
        run: |
          git config --global user.name "Foreman CI"
          git config --global user.email "ci@example.invalid"
      - name: Unit tests
        run: python -m unittest discover -s tests -q

  foreman:
    # Foreman on its own pull requests: skipped or deleted tests, a changed check, secrets. It runs the BASE branch's
    # detector (a second worktree), so a pull request that weakens the detector cannot approve itself.
    name: foreman (pull requests)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Run the base's detector against the pull request
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git worktree add ../base "origin/$BASE"
          cd ../base
          python -m foreman.detector "origin/$BASE" HEAD --repo "$GITHUB_WORKSPACE"
