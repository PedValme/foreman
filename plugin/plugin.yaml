name: foreman
version: "0.1.0"
manifest_version: 2
api_version: 1
description: "A green check the agent did not rig: a deterministic gate (no model) that blocks git commit, git push and gh pr create when the change skips, isolates, deletes or moves tests, edits what the check runs, bypasses hooks or carries a secret, always blocks an agent-run gh pr merge (merging is yours), and asks the agent to undo it before it finishes a coding turn. On demand, /foreman review asks a second model to review the diff."
author: "PedValme"
license: MIT
homepage: https://github.com/PedValme/foreman
tags: [git, testing, security, coding]
requires_hermes: ">=0.22.6"
provides_tools:
  - foreman_check
  - foreman_review
provides_hooks:
  - pre_tool_call
  - pre_verify
capabilities:
  - llm.model_override     # /foreman review on a model other than the one that wrote the code
  - llm.provider_override  # ...when that model lives on another provider
config_schema:
  reviewer_model:
    type: str
    default: ""
    label: "Reviewer model (optional)"
    description: "Leave empty and pick the reviewer from your configured models in Hermes's auxiliary models: Desktop → Settings → Models → Auxiliary → Foreman review (CLI: hermes model → Configure auxiliary models). By default it is your first Hermes fallback model, and it needs no extra permission. A model typed here overrides that pick and needs the llm.model_override capability."
  reviewer_provider:
    type: str
    default: ""
    label: "Reviewer provider (optional)"
    description: "Only with a Reviewer model typed above: its Hermes provider id when it is not your active provider (e.g. openrouter). Needs the llm.provider_override capability."
  auto_review:
    type: str
    choices: [merge, finish, "off"]
    default: merge
    label: "Automatic review"
    description: "merge: /foreman merge first gets the second-model review of the pull request's exact head (one model call per new diff). finish: every coding turn is reviewed through the foreman_review tool and sent back to the agent until it is clean, max_bounces is reached or its review budget (max_bounces + 1 model calls per change, renewed when you merge, reject or review it yourself) is used. off: the review runs only when you type /foreman review. Foreman never merges for the agent: /foreman merge waits for you."
  max_bounces:
    type: int
    default: 3
    label: "Bounce limit"
    description: "With auto_review finish: how many times a change is sent back to the agent before Foreman stops and hands it to you. Never more than Hermes's agent.max_verify_nudges."
  notify:
    type: str
    choices: ["off", "on"]
    default: "off"
    label: "Notifications"
    description: "Off: nothing is sent anywhere. On: a message to notify_to when a pull request waits for you, and when one is merged or rejected through Foreman, sent with `hermes send` through Hermes's terminal tool and your own bot. Same as /foreman notify on|off."
  notify_to:
    type: str
    default: ""
    label: "Notify where"
    description: "A hermes send target: telegram (your Telegram home channel, set with /sethome), telegram:<chat id>, discord:#channel, slack:<channel id>."
