name: foreman
repo: https://github.com/PedValme/foreman
sha: "REPLACE_WITH_40_CHAR_COMMIT_SHA_OF_PEDVALME_FOREMAN"  # PLACEHOLDER: the loader rejects anything but 40 hex
subdir: plugin
title: Foreman
description: "A green check the agent did not rig. A deterministic gate (no model, standard library and git) blocks git commit, git push and gh pr create when the change skips, deletes or moves tests, weakens what the check runs, bypasses hooks or carries a secret; an optional second model reviews what rules cannot see, such as a loosened assertion. /foreman shows each pull request with a verdict and merges only on your command; a Desktop panel shows where each change is. Disclosure — runs read-only git in your repository; runs the GitHub CLI and model calls only on /foreman commands (merge and reject write to GitHub after your confirmation); notifications are off until you turn them on; no telemetry, no credentials, no network calls of its own. Full disclosure in the README."
maintainer: PedValme
tier: community
category: automation
requires_hermes: ">=0.22.6"
version: "0.1.0"
docs_url: https://github.com/PedValme/foreman/blob/main/plugin/README.md
